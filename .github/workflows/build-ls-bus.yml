name: Build Layered Standard Network Communication

on:
  push:
    branches-ignore: [ 'temp/*' ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  build-ls-bus:
    name: Build Layered Standard Network Communication 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Generate revnumber
      run: |
        [[ $GITHUB_REF_TYPE == "tag" ]] && REVNUMBER=${GITHUB_REF:11} || REVNUMBER=${GITHUB_SHA:0:7}
        echo GITHUB_SHA:      $GITHUB_SHA
        echo GITHUB_REF_TYPE: $GITHUB_REF_TYPE
        echo GITHUB_REF:      $GITHUB_REF
        echo REVNUMBER:       $REVNUMBER
        echo "REVNUMBER=$REVNUMBER" >> $GITHUB_ENV
    
    - name: Create build directory
      run: |
        mkdir -p build/headers
        mkdir -p build/schema
        mkdir -p build/images/schema

    - name: Generate HTML
      run: |
        docker run --rm -v $PWD:/documents/ \
          asciidoctor/docker-asciidoctor:1.101 \
          asciidoctor -B /documents/docs -b html5 --failure-level INFO -v docs/index.adoc \
          --attribute=revnumber=${{ env.REVNUMBER }} \
          --attribute=revdate=$(date +%F)

    - name: Create build directory
      run: |
        mkdir -p build/headers
        mkdir -p build/images/schema
        mkdir -p build/theme/css
        mkdir -p build/theme/images
        mkdir -p build/theme/js
    
    - name: Copy resources
      run: |
        cp LICENSE.txt build
        cp headers/*.h build/headers
        cp docs/index.html build
        cp docs/images/*.svg build/images
        cp docs/theme/css/*.css build/theme/css
        cp docs/theme/images/*.svg build/theme/images
        cp docs/theme/js/*.js build/theme/js

    - name: Create ZIP archive
      uses: actions/upload-artifact@v5
      with:
        name: FMI-LS-BUS
        path: build/*
        if-no-files-found: error

    - name: extract branch name
      id: extract_branch
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
    - name: deploy
      if: >-
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build
        destination_dir: ${{ github.ref_name }}
        enable_jekyll: true
